<svg xmlns="http://www.w3.org/2000/svg" width="158" height="20" role="img" aria-label="auto update: every 3 days">
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#fff" stop-opacity=".25"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="r"><rect width="158" height="20" rx="4" fill="#fff"/></clipPath>
  <g clip-path="url(#r)">
    <rect width="72" height="20" fill="#1f2430"/>
    <rect x="72" width="86" height="20" fill="#7c3aed"/>
    <rect width="158" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="11">
    <text x="37" y="15" fill="#cdd3e1">auto update</text>
    <text x="114" y="15">every 3 days</text>
  </g>
</svg>
