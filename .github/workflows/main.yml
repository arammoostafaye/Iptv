name: IPTV Auto Update V2

on:
  schedule:
    - cron: '0 */6 * * *'  # هر 6 ساعت - حرفه ای
  workflow_dispatch:
    inputs:
      skip_check:
        description: 'Skip stream check (fast test)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      limit:
        description: 'Limit channels for test (0 = no limit)'
        required: false
        default: '0'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "iptv-update"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: check_cache.json
          key: iptv-cache-${{ hashFiles('list.m3u') }}
          restore-keys: |
            iptv-cache-

      - name: Load premium sources (if any)
        env:
          PREMIUM_SOURCES: ${{ secrets.PREMIUM_SOURCES }}
        run: |
          if [ ! -z "$PREMIUM_SOURCES" ]; then
            echo "$PREMIUM_SOURCES" > premium_sources.txt
            echo "✅ Loaded premium sources from secrets (${#PREMIUM_SOURCES} chars)"
            wc -l premium_sources.txt
          else
            echo "ℹ️ No PREMIUM_SOURCES secret, using existing file"
          fi
          if [ -f premium_sources.txt ]; then
            echo "Existing premium: $(wc -l < premium_sources.txt) accounts"
          fi

      - name: Auto Premium Scraper (Scheduled - No API needed)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Running auto premium scraper (target 100 accounts)..."
          # Try to collect more accounts automatically
          python collect_premium.py || echo "⚠️ Premium collection failed, continuing with existing"
          
          if [ -f premium_sources.txt ]; then
            echo "✅ Premium accounts after auto-scrape: $(grep -v '^#' premium_sources.txt | wc -l) valid"
            head -10 premium_sources.txt
          fi

      - name: Run IPTV V2 Builder (ALL categories - Movies, Documentary, Wildlife, Kids...)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          CHECK_TIMEOUT: '12'
          CHECK_CONCURRENCY: '120'
          IPTV_LIMIT: ${{ github.event.inputs.limit || '0' }}
          IPTV_SKIP_CHECK: ${{ github.event.inputs.skip_check == 'true' && '1' || '0' }}
          ENABLE_GITHUB_SCRAPE: '0'  # فعال کن اگر میخوای گیتهاب اسکرپ هم بکنه (مصرف API)
        run: |
          python update_iptv_v2.py
          echo "=== Generated files ==="
          ls -lh *.m3u *.json 2>/dev/null || true
          ls -lh output/ 2>/dev/null || true

      - name: Generate stats
        run: |
          echo "## 📊 IPTV Stats" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f channels.json ]; then
            TOTAL=$(jq '.total' channels.json)
            echo "- Total channels: $TOTAL" >> $GITHUB_STEP_SUMMARY
            echo "- Groups: $(jq -c '.groups' channels.json)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            jq '.groups' channels.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Files" >> $GITHUB_STEP_SUMMARY
          ls -lh *.m3u 2>/dev/null | awk '{print "- " $9 ": " $5}' >> $GITHUB_STEP_SUMMARY || true

      - name: Commit & Push
        run: |
          git config --global user.name "AnonTV Bot"
          git config --global user.email "bot@anontv.github"
          
          # Add all generated files
          git add list.m3u channels.json kurdish.m3u persian.m3u kurdish-persian.m3u sports.m3u movies.m3u music.m3u news.m3u kids.m3u documentary.m3u output/ 2>/dev/null || true
          git add check_cache.json 2>/dev/null || true
          
          # Check if there are changes
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          TOTAL=$(jq '.total' channels.json 2>/dev/null || echo "unknown")
          KURD=$(jq '.groups.Kurdish // 0' channels.json 2>/dev/null || echo "0")
          PERS=$(jq '.groups.Persian // 0' channels.json 2>/dev/null || echo "0")
          
          git commit -m "Auto update: $TOTAL channels (Kurdish: $KURD, Persian: $PERS) - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Deploy to GitHub Pages (Web Player)
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'AnonTV Bot'
          user_email: 'bot@anontv.github'
          commit_message: 'Deploy web player'

  # Job برای چک کردن سلامت لینک ها و باز کردن Issue اگر مشکل بود
  health-check:
    runs-on: ubuntu-latest
    needs: build
    if: failure()
    
    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `IPTV Update Failed - ${new Date().toISOString()}`,
              body: `The auto-update workflow failed. Please check the logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'auto-update']
            })
