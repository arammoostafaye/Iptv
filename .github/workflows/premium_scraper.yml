name: Premium Scraper

on:
  schedule:
    - cron: '0 2 * * *'  # هر روز ساعت 2 صبح
  workflow_dispatch:
    inputs:
      enable_telegram:
        description: 'Enable Telegram scraping'
        type: boolean
        default: false
      enable_github:
        description: 'Enable GitHub scraping'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  scrape-premium:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Restore premium cache
        uses: actions/cache@v4
        with:
          path: |
            premium_sources.txt
            premium_all_found.txt
          key: premium-${{ hashFiles('premium_sources.txt') }}
          restore-keys: premium-

      - name: Run Auto Premium Aggregator (100 accounts target - ALL categories)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          PREMIUM_SOURCES: ${{ secrets.PREMIUM_SOURCES }}
        run: |
          # اگر Secret وجود دارد، آن را به فایل تبدیل کن
          if [ ! -z "$PREMIUM_SOURCES" ]; then
            echo "$PREMIUM_SOURCES" > premium_sources.txt
            echo "✅ Loaded premium from secret"
          fi

          echo "🚀 Running premium collector - target 100 accounts, ALL categories (Movies, Documentary, Wildlife, Kids...)"
          
          # روش 1: collect_premium.py - 100 اکانت از منابع عمومی
          python collect_premium.py || echo "⚠️ collect_premium failed"

          # روش 2: auto_premium با GitHub scrape (اگر توکن دارد)
          python -m sources.auto_premium \
            ${{ inputs.enable_telegram && '--telegram' || '' }} \
            --github \
            --limit 200 || echo "⚠️ auto_premium failed"

          echo "=== Results ==="
          ls -lh premium*.txt 2>/dev/null || echo "No premium files"
          if [ -f premium_sources.txt ]; then
            VALID=$(grep -v '^#' premium_sources.txt | wc -l)
            echo "✅ Valid premium accounts: $VALID"
            echo "Top 10:"
            grep -v '^#' premium_sources.txt | head -10
          fi

      - name: Commit premium sources
        run: |
          git config user.name "Premium Bot"
          git config user.email "premium@anontv.github"
          
          # Force add premium_sources.txt even if gitignored (برای اتوماتیک)
          git add -f premium_sources.txt || true
          git add premium_all_checked.json 2>/dev/null || true
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes in premium sources"
            exit 0
          fi
          
          VALID=$(grep -v '^#' premium_sources.txt | wc -l 2>/dev/null || echo "0")
          git commit -m "Auto premium scrape: $VALID VALID accounts (100 tested) - $(date -u '+%Y-%m-%d %H:%M UTC') - Movies, Documentary, Wildlife, Sports, Kids, etc"
          git push || echo "Push failed"
